<svg width="467" height="232" viewBox="0 0 467 232" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="LIFEOS MOBILE â€” Android personal productivity application built with Expo and local SQLite storage for tracking daily tasks, habits, personal expenses, and scheduled local reminders.">
  <style>
    .idx { font: 800 13px 'Space Mono', 'Courier New', monospace; fill: #000000; }
