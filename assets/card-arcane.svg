<svg width="467" height="232" viewBox="0 0 467 232" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ARCANE INTERACTIVE â€” Front-end motion study inspired by Zentry and Arcane, implementing GSAP polygon clip-path transitions, timed video hero sequences, and interactive audio controls.">
  <style>
