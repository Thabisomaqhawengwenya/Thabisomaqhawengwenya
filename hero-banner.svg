<svg width="960" height="230" viewBox="0 0 960 230" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">Maqhawe Thabiso Ngwenya - Full-Stack &amp; Mobile Software Engineer</title>
  <desc id="heroDesc">Full-Stack Web, React Native Mobile, 3D WebGL, and AI-Powered Systems Engineer based in Bulawayo, Zimbabwe.</desc>
  <style>
    .bg-grid {
      stroke: #24283b;
      stroke-width: 1;
      opacity: 0.45;
    }
    .eyebrow {
      font: 600 11.5px 'Space Mono', 'Fira Code', Consolas, 'Courier New', monospace;
      fill: #38bdae;
      letter-spacing: 1.8px;
    }
    .meta-right {
      font: 500 11px 'Space Mono', 'Fira Code', Consolas, 'Courier New', monospace;
      fill: #7aa2f7;
      letter-spacing: 1.2px;
    }
    .name {
      font: 800 36px 'Segoe UI', -apple-system, BlinkMacSystemFont, Ubuntu, sans-serif;
      fill: #f8fafc;
      letter-spacing: -0.6px;
    }
    .subtitle {
      font: 500 16px 'Segoe UI', -apple-system, BlinkMacSystemFont, Ubuntu, sans-serif;
      fill: #a9b1d6;
    }
    .pill-bg {
      fill: #24283b;
      stroke: #3b4261;
      stroke-width: 1;
    }
    .pill-text {
      font: 600 11.5px 'Space Mono', 'Fira Code', Consolas, 'Courier New', monospace;
      fill: #c0caf5;
      letter-spacing: 0.4px;
    }
    .pill-accent {
      fill: #70a5fd;
    }
    .status-dot {
      fill: #38bdae;
      animation: pulseGlow 2.4s ease-in-out infinite;
    }
    .status-ring {
      stroke: #38bdae;
      stroke-width: 1.5;
      fill: none;
      opacity: 0.4;
      transform-box: fill-box;
      transform-origin: center;
      animation: ringExpand 2.4s ease-out infinite;
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.55; }
    }
    @keyframes ringExpand {
      0% { transform: scale(0.8); opacity: 0.7; }
      100% { transform: scale(2.1); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .status-dot, .status-ring {
        animation: none;
      }
    }
  </style>

  <defs>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="960" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#16161e" />
      <stop offset="55%" stop-color="#1a1b27" />
      <stop offset="100%" stop-color="#1f2335" />
    </linearGradient>
    <radialGradient id="accentGlow" cx="85%" cy="20%" r="45%">
      <stop offset="0%" stop-color="#70a5fd" stop-opacity="0.16" />
      <stop offset="55%" stop-color="#38bdae" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#1a1b27" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="topBorderGrad" x1="0" y1="0" x2="960" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdae" />
      <stop offset="50%" stop-color="#70a5fd" />
      <stop offset="100%" stop-color="#bf91f3" />
    </linearGradient>
  </defs>

  <!-- Outer Surface -->
  <rect x="0.5" y="0.5" width="959" height="229" rx="10" fill="url(#cardGrad)" stroke="#292e42" stroke-width="1" />
  <rect x="0.5" y="0.5" width="959" height="229" rx="10" fill="url(#accentGlow)" />

  <!-- Architectural Grid Lines -->
  <line x1="0" y1="52" x2="960" y2="52" class="bg-grid" />
  <line x1="0" y1="168" x2="960" y2="168" class="bg-grid" />
  <line x1="680" y1="0" x2="680" y2="230" class="bg-grid" />
  <line x1="820" y1="0" x2="820" y2="230" class="bg-grid" />

  <!-- Top Accent Bar -->
  <rect x="1" y="1" width="958" height="3" rx="1.5" fill="url(#topBorderGrad)" />

  <!-- Top Telemetry Bar -->
  <g transform="translate(36, 31)">
    <circle cx="6" cy="-4" r="4.5" class="status-dot" />
    <circle cx="6" cy="-4" r="4.5" class="status-ring" />
    <text x="20" y="0" class="eyebrow">FULL-STACK WEB • REACT NATIVE MOBILE • AI SYSTEMS</text>
  </g>
  <text x="924" y="31" text-anchor="end" class="meta-right">BULAWAYO, ZW // GMT+2</text>

  <!-- Main Headline & Copy -->
  <g transform="translate(36, 102)">
    <text x="0" y="0" class="name">Maqhawe Thabiso Ngwenya</text>
    <text x="0" y="34" class="subtitle">Engineering high-craft web applications, offline-first mobile products, and interactive 3D interfaces.</text>
  </g>

  <!-- Bottom Architecture Pills -->
  <g transform="translate(36, 184)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="196" height="28" rx="14" class="pill-bg" />
      <circle cx="15" cy="14" r="3.5" fill="#3178c6" />
      <text x="26" y="18" class="pill-text">TypeScript &amp; React.js</text>
    </g>
    <!-- Pill 2 -->
    <g transform="translate(208, 0)">
      <rect x="0" y="0" width="192" height="28" rx="14" class="pill-bg" />
      <circle cx="15" cy="14" r="3.5" fill="#38bdae" />
      <text x="26" y="18" class="pill-text">Expo &amp; React Native</text>
    </g>
    <!-- Pill 3 -->
    <g transform="translate(412, 0)">
      <rect x="0" y="0" width="196" height="28" rx="14" class="pill-bg" />
      <circle cx="15" cy="14" r="3.5" fill="#bf91f3" />
      <text x="26" y="18" class="pill-text">Node.js • SQL • AI</text>
    </g>
    <!-- Pill 4 -->
    <g transform="translate(620, 0)">
      <rect x="0" y="0" width="184" height="28" rx="14" class="pill-bg" />
      <circle cx="15" cy="14" r="3.5" fill="#f1e05a" />
      <text x="26" y="18" class="pill-text">Three.js &amp; GSAP 3D</text>
    </g>
  </g>
</svg>
