<svg
  width="300"
  height="220"
  viewBox="0 0 300 220"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-label="Most Used Languages: TypeScript 60%, JavaScript 25%, Python 10%, CSS 5%"
>
  <style>
    .header {
      font: 600 18px 'Segoe UI', Ubuntu, Sans-Serif;
      fill: #70a5fd;
    }
    .lang-name {
      font: 400 11px 'Segoe UI', Ubuntu, Sans-Serif;
      fill: #a9b1d6;
    }
    .lang-percent {
      font: 600 11px 'Segoe UI', Ubuntu, Sans-Serif;
      fill: #a9b1d6;
    }
  </style>

  <rect
    x="0.5"
    y="0.5"
    rx="4.5"
    height="99%"
    width="299"
    fill="#1a1b27"
    stroke="#1f2335"
    stroke-width="1"
    stroke-opacity="0"
  />

  <g transform="translate(25, 35)">
    <text x="0" y="0" class="header">Most Used Languages</text>
  </g>

  <!-- Progress Bar -->
  <g transform="translate(25, 55)">
    <mask id="rect-mask">
      <rect x="0" y="0" width="250" height="8" rx="4" fill="white" />
    </mask>
    <!-- Gray background -->
    <rect x="0" y="0" width="250" height="8" rx="4" fill="#24283b" />
    <!-- Segments -->
    <rect mask="url(#rect-mask)" x="0" y="0" width="150" height="8" fill="#3178c6" />
    <rect mask="url(#rect-mask)" x="150" y="0" width="62.5" height="8" fill="#f1e05a" />
    <rect mask="url(#rect-mask)" x="212.5" y="0" width="25" height="8" fill="#3776ab" />
    <rect mask="url(#rect-mask)" x="237.5" y="0" width="12.5" height="8" fill="#563d7c" />
  </g>

  <!-- Grid of Languages -->
  <g transform="translate(25, 85)">
    <!-- Column 1 -->
    <g transform="translate(0, 0)">
      <!-- TypeScript -->
      <g transform="translate(0, 0)">
        <circle cx="5" cy="6" r="5" fill="#3178c6" />
        <text x="18" y="10" class="lang-name">TypeScript <tspan class="lang-percent">60.0%</tspan></text>
      </g>
      <!-- Python -->
      <g transform="translate(0, 25)">
        <circle cx="5" cy="6" r="5" fill="#3776ab" />
        <text x="18" y="10" class="lang-name">Python <tspan class="lang-percent">10.0%</tspan></text>
      </g>
    </g>

    <!-- Column 2 -->
    <g transform="translate(140, 0)">
      <!-- JavaScript -->
      <g transform="translate(0, 0)">
        <circle cx="5" cy="6" r="5" fill="#f1e05a" />
        <text x="18" y="10" class="lang-name">JavaScript <tspan class="lang-percent">25.0%</tspan></text>
      </g>
      <!-- CSS -->
      <g transform="translate(0, 25)">
        <circle cx="5" cy="6" r="5" fill="#563d7c" />
        <text x="18" y="10" class="lang-name">CSS <tspan class="lang-percent">5.0%</tspan></text>
      </g>
    </g>
  </g>
</svg>
