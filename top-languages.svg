<svg
  width="467"
  height="195"
  viewBox="0 0 467 195"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-label="Most Used Languages: TypeScript 60.0%, JavaScript 25.0%, Python 10.0%, CSS 5.0%"
>
  <style>
    .header {
      font: 600 18px 'Segoe UI', Ubuntu, Sans-Serif;
      fill: #70a5fd;
    }
    .sub-label {
      font: 500 11px 'Space Mono', 'Fira Code', Consolas, monospace;
      fill: #7aa2f7;
    }
    .lang-name {
      font: 600 13px 'Segoe UI', Ubuntu, Sans-Serif;
      fill: #c0caf5;
    }
    .lang-percent {
      font: 700 12.5px 'Space Mono', 'Fira Code', Consolas, monospace;
      fill: #38bdae;
    }
  </style>

  <rect
    x="0.5"
    y="0.5"
    rx="8"
    height="194"
    width="466"
    fill="#1a1b27"
    stroke="#292e42"
    stroke-width="1"
  />

  <g transform="translate(25, 34)">
    <text x="0" y="0" class="header">Most Used Languages</text>
    <text x="417" y="0" text-anchor="end" class="sub-label">CORE TELEMETRY</text>
  </g>

  <!-- Progress Bar -->
  <g transform="translate(25, 56)">
    <mask id="rect-mask">
      <rect x="0" y="0" width="417" height="10" rx="5" fill="white" />
    </mask>
    <rect x="0" y="0" width="417" height="10" rx="5" fill="#24283b" />
    <rect mask="url(#rect-mask)" x="0.00" y="0" width="250.2" height="10" fill="#3178c6" />
    <rect mask="url(#rect-mask)" x="250.20" y="0" width="104.25" height="10" fill="#f1e05a" />
    <rect mask="url(#rect-mask)" x="354.45" y="0" width="41.7" height="10" fill="#3776ab" />
    <rect mask="url(#rect-mask)" x="396.15" y="0" width="20.85" height="10" fill="#563d7c" />
  </g>

  <!-- 2-Column Language Matrix -->
  <g transform="translate(25, 92)">
    
      <g transform="translate(0, 0)">
        <circle cx="6" cy="6" r="5.5" fill="#3178c6" />
        <text x="20" y="10" class="lang-name">TypeScript</text>
        <text x="185" y="10" text-anchor="end" class="lang-percent">60.0%</text>
      </g>
      <g transform="translate(0, 32)">
        <circle cx="6" cy="6" r="5.5" fill="#3776ab" />
        <text x="20" y="10" class="lang-name">Python</text>
        <text x="185" y="10" text-anchor="end" class="lang-percent">10.0%</text>
      </g>
    
      <g transform="translate(224, 0)">
        <circle cx="6" cy="6" r="5.5" fill="#f1e05a" />
        <text x="20" y="10" class="lang-name">JavaScript</text>
        <text x="185" y="10" text-anchor="end" class="lang-percent">25.0%</text>
      </g>
      <g transform="translate(224, 32)">
        <circle cx="6" cy="6" r="5.5" fill="#563d7c" />
        <text x="20" y="10" class="lang-name">CSS</text>
        <text x="185" y="10" text-anchor="end" class="lang-percent">5.0%</text>
      </g>
  </g>
</svg>
